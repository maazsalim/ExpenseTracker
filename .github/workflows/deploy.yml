# Build, test and deploy on every push to main. Each step only runs if the previous one
# succeeded, so a failing test stops the deploy.
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   AZURE_WEBAPP_PUBLISH_PROFILE  (Azure Portal → the web app → Download publish profile)
#              NEON_CONNECTION_STRING        (the .NET connection string of the Neon database)
#   Variables: AZURE_WEBAPP_NAME             (the web app's name in Azure)

name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/ExpenseTracker --configuration Release --no-build --output publish

      # Database changes: an EF Core migration bundle applies any new migrations to Neon
      # before the new code goes live. Already-applied migrations are skipped.
      - name: Update database
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations bundle --project src/ExpenseTracker --configuration Release --output efbundle --force
          ./efbundle --connection "$NEON_CONNECTION_STRING"

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
